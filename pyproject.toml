[project]
name = "finalproject-romanov-m26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]
[tool.valutatrade]
rates_ttl_seconds = 300
default_base_currency = "USD"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[project.scripts]
trade_hub = "valutatrade_hub.cli.interface:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]